name: MCSH

env:
  # For Chicago time on log messages:
  TZ: America/Chicago

on:
  # workflow_dispatch (manual) only works on default branch
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read    # To read the project source code (git)

jobs:
  run_tests:
    name: OS=${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install software
        run: |
          .github/workflows/install-zsh.sh

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool flex bison
          # Homebrew's flex and bison are keg-only; the system ones are too old.
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Bootstrap
        run: |
          ./bootstrap

      - name: Configure
        run: |
          ./configure --prefix=$HOME/mcsh-install --disable-readline

      - name: Make mcsh
        run: |
          make bin/mcsh

      - name: Sanity mcsh
        run: |
          bin/mcsh -h

      - name: Tests
        run: |
          timeout 1h test/script/test-all.zsh
